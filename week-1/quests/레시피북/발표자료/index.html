    @keyframes slideIn {

      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInBack {
      from { opacity: 0; transform: translateX(-24px); }

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary:   'bg-[#1428A0] text-white hover:bg-[#0C1A6B] focus-visible:ring-[#1428A0]',
        secondary: 'bg-white text-neutral-800 ring-1 ring-neutral-300 hover:bg-neutral-100 focus-visible:ring-neutral-400',

        ghost:     'bg-transparent text-neutral-300 hover:bg-white/10 hover:text-white focus-visible:ring-white/40',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-1.5 rounded-full font-semibold tracking-tight transition
            focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-900
            disabled:opacity-30 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Badge({ tone = 'blue', className = '', children }) {
      const tones = {
        blue:    'bg-[#1428A0] text-white',
        outline: 'bg-transparent text-[#1428A0] ring-1 ring-[#1428A0]/30',
        light:   'bg-neutral-100 text-neutral-600',
        dark:    'bg-white/10 text-white ring-1 ring-white/20',
      };
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-[13px] font-semibold tracking-tight ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Eyebrow({ children, tone = 'blue', className = '' }) {
      const color = tone === 'blue' ? 'text-[#1428A0]' : 'text-white/60';
      return (
        <p className={`text-[13px] font-bold uppercase tracking-[0.22em] ${color} ${className}`}>{children}</p>
      );
    }

    function Rule({ className = '' }) {
      return <div className={`h-px w-full bg-neutral-200 ${className}`} />;
    }

    function StatBlock({ label, value, sub }) {
      return (
        <div className="border-t-2 border-[#1428A0] pt-3">

          {sub && <p className="mt-1 text-[13px] text-neutral-500">{sub}</p>}

    /** 16:9 무대를 컨테이너 폭에 맞춰 균일 축소한다 (레이아웃 깨짐 없이 스케일). */
    function Stage({ children }) {
      const wrapRef = useRef(null);
      const [scale, setScale] = useState(1);

      useEffect(() => {
        const el = wrapRef.current;
        if (!el) return undefined;
        const update = () => {
          const { width, height } = el.getBoundingClientRect();
          if (!width || !height) return;
          setScale(Math.min(width / STAGE_W, height / STAGE_H));
        };
        update();
        const observer = new ResizeObserver(update);
        observer.observe(el);
        window.addEventListener('resize', update);
        return () => {
          observer.disconnect();
          window.removeEventListener('resize', update);
        };
      }, []);

      return (
        <div ref={wrapRef} className="flex h-full w-full items-center justify-center">
          <div
            className="origin-center shadow-2xl"
            style={{ width: STAGE_W, height: STAGE_H, transform: `scale(${scale})` }}
          >
            {children}
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    /** 해시(#/3)와 슬라이드 인덱스를 동기화해 딥링크·새로고침을 지원한다. */
    function useHashSlide(total) {
      const parse = useCallback(() => {
        const raw = parseInt((window.location.hash || '').replace(/^#\/?/, ''), 10);
        if (Number.isNaN(raw)) return 0;
        return Math.min(Math.max(raw - 1, 0), total - 1);
      }, [total]);

      const [index, setIndex] = useState(parse);

      useEffect(() => {
        const onHashChange = () => setIndex(parse());
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, [parse]);

      const goTo = useCallback((next) => {
        const clamped = Math.min(Math.max(next, 0), total - 1);
        window.location.hash = `#/${clamped + 1}`;
        setIndex(clamped);
      }, [total]);

      return [index, goTo];
    }

    function App() {
      const [overviewOpen, setOverviewOpen] = useState(false);
      const directionRef = useRef('next');

      // 목차 카드 → 해당 레시피로 점프 (goTo 정의 이전이라 ref 로 우회)
      const goToRef = useRef(() => {});
      const slides = useMemo(
        () => buildSlides((recipeIdx) => goToRef.current(recipeSlideIndex(recipeIdx))),
        []
      );
      const total = slides.length;

      const [index, goTo] = useHashSlide(total);
      goToRef.current = goTo;

      const go = useCallback((next) => {
        directionRef.current = next > index ? 'next' : 'prev';
        goTo(next);
      }, [goTo, index]);

      const prev = useCallback(() => go(index - 1), [go, index]);
      const next = useCallback(() => go(index + 1), [go, index]);

      // 키보드 내비게이션
      useEffect(() => {
        const onKey = (e) => {
          if (overviewOpen) return;
          if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
          else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
          else if (e.key === 'Home') { e.preventDefault(); go(0); }
          else if (e.key === 'End') { e.preventDefault(); go(total - 1); }
          else if (e.key === 'o' || e.key === 'O') { setOverviewOpen(true); }
          else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [next, prev, go, total, overviewOpen]);

      const toggleFullscreen = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
      };

      const current = slides[index];

      return (
        <div className="flex h-screen flex-col bg-neutral-900">
          <ProgressBar index={index} total={total} />

          <main className="min-h-0 flex-1 p-4 sm:p-6">
            <Stage>
              <div key={index} className={directionRef.current === 'next' ? 'anim-next h-full' : 'anim-prev h-full'}>
                {current.element}
                <SlideFooter label={current.label} index={index} total={total} />
              </div>
            </Stage>
          </main>

          <ControlBar
            index={index}
            total={total}
            label={current.label}
            onPrev={prev}
            onNext={next}
            onToggleOverview={() => setOverviewOpen(true)}
            onFullscreen={toggleFullscreen}
          />

          <p className="no-print pb-3 text-center text-[11px] text-neutral-600">
            ← → 이동 · Space 다음 · Home / End 처음·끝 · O 목록 · F 전체화면
          </p>

          <OverviewPanel
            isOpen={overviewOpen}
            slides={slides}
            index={index}
            onSelect={(i) => { go(i); setOverviewOpen(false); }}
            onClose={() => setOverviewOpen(false)}
          />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
