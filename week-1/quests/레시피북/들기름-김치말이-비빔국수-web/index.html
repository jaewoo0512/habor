<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15분 들기름 김치말이 비빔국수</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- CDN 버전 고정: Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가한 것만 */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp .35s ease-out both; }

    @keyframes pulseRing {
      0%   { box-shadow: 0 0 0 0 rgba(220, 38, 38, .45); }
      70%  { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .pulse-ring { animation: pulseRing 1.8s ease-out infinite; }

    /* 인쇄 시 조작 UI 숨김 */
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
    }
  </style>
</head>
<body class="bg-stone-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary:   'bg-red-600 text-white hover:bg-red-700 focus-visible:ring-red-500',
        secondary: 'bg-white text-stone-700 border border-stone-300 hover:bg-stone-100 focus-visible:ring-stone-400',
        danger:    'bg-stone-800 text-white hover:bg-stone-900 focus-visible:ring-stone-600',
        ghost:     'bg-transparent text-stone-600 hover:bg-stone-200/70 focus-visible:ring-stone-400',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-1.5 rounded-lg font-semibold transition
            focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
            disabled:opacity-40 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm ring-1 ring-stone-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'neutral', className = '', children }) {
      const tones = {
        neutral: 'bg-stone-100 text-stone-600 ring-stone-200',
        red:     'bg-red-50 text-red-700 ring-red-200',
        green:   'bg-emerald-50 text-emerald-700 ring-emerald-200',
        amber:   'bg-amber-50 text-amber-800 ring-amber-200',
      };
      return (
        <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function SectionTitle({ eyebrow, title, children }) {
      return (
        <div className="mb-5">
          {eyebrow && <p className="text-xs font-bold uppercase tracking-widest text-red-600">{eyebrow}</p>}
          <h2 className="mt-1 text-2xl font-bold tracking-tight text-stone-900">{title}</h2>
          {children && <p className="mt-1 text-sm text-stone-500">{children}</p>}
        </div>
      );
    }

    function Checkbox({ checked, onChange, label, sub }) {
      return (
        <label className="flex cursor-pointer items-start gap-3 rounded-lg px-2 py-2 transition hover:bg-stone-50">
          <input
            type="checkbox"
            checked={checked}
            onChange={onChange}
            className="mt-0.5 h-5 w-5 shrink-0 cursor-pointer accent-red-600"
          />
          <span className="min-w-0 flex-1">
            <span className={`block text-sm font-medium transition ${checked ? 'text-stone-400 line-through' : 'text-stone-800'}`}>
              {label}
            </span>
            {sub && <span className="mt-0.5 block text-xs text-stone-500">{sub}</span>}
          </span>
        </label>
      );
    }

    // ========================================
    // 📊 Recipe Data (원본 레시피 기준)
    // ========================================

    const BASE_SERVINGS = 2;

    const INGREDIENTS = [
      { group: '기본', name: '소면',        qty: 200,  unit: 'g',      note: '' },
      { group: '기본', name: '잘 익은 김치', qty: 1,    unit: '컵',     note: '잘게 썰기' },
      { group: '기본', name: '김치 국물',    qty: 3,    unit: '큰술',   note: '' },
      { group: '기본', name: '오이',        qty: 0.5,  unit: '개',     note: '채 썰기' },
      { group: '기본', name: '달걀',        qty: 2,    unit: '개',     note: '반숙 8분' },
      { group: '기본', name: '김가루',      qty: null, unit: '한 줌',  note: '' },
      { group: '양념', name: '들기름',      qty: 2,    unit: '큰술',   note: '' },
      { group: '양념', name: '고추장',      qty: 1,    unit: '큰술',   note: '' },
      { group: '양념', name: '설탕',        qty: 1,    unit: '큰술',   note: '' },
      { group: '양념', name: '식초',        qty: 1,    unit: '큰술',   note: '안 신 김치면 1/2큰술 추가' },
      { group: '양념', name: '간장',        qty: 1,    unit: '작은술', note: '' },
      { group: '양념', name: '다진 마늘',   qty: 0.5,  unit: '작은술', note: '' },
      { group: '양념', name: '통깨',        qty: 1,    unit: '큰술',   note: '' },
    ];

    const STEPS = [
      {
        at: 0, title: '물 올리기 + 달걀',
        body: '냄비에 물을 올리고, 동시에 다른 냄비에 달걀을 넣어 삶기 시작한다.',
        tip: '반숙은 8분.',
      },
      {
        at: 2, title: '양념장 만들기',
        body: '볼에 양념 재료를 모두 넣고 잘 섞는다. 여기에 썬 김치와 김치 국물을 넣어 미리 버무려 둔다.',
        tip: '김치에 양념이 배는 시간이 맛을 좌우한다.',
      },
      {
        at: 5, title: '오이 준비',
        body: '오이를 얇게 채 썰어 소금 한 꼬집에 절였다가 물기를 살짝 짠다.',
        tip: '',
      },
      {
        at: 7, title: '면 삶기',
        body: '물이 끓으면 소면을 넣고 3분간 삶는다.',
        tip: '끓어 넘치려 하면 찬물 반 컵을 부어 가라앉힌다.',
      },
      {
        at: 11, title: '찬물 헹구기',
        body: '삶은 면을 체에 밭쳐 얼음처럼 차가운 물에 손으로 박박 비벼가며 헹군다. 물기는 꽉 짠다.',
        tip: '표면 전분을 완전히 씻어내야 면이 쫄깃하고 안 붇는다.',
      },
      {
        at: 14, title: '비비기',
        body: '면을 양념 볼에 넣고 손으로 조물조물 버무린다.',
        tip: '젓가락보다 손이 훨씬 잘 섞인다.',
      },
      {
        at: 15, title: '담기',
        body: '그릇에 담고 오이채, 반으로 자른 달걀, 김가루를 올린 뒤 들기름을 조금 더 두른다.',
        tip: '',
      },
    ];

    const KEY_POINTS = [
      { title: '면은 차가운 물에 비벼 헹군다', body: '미지근하게 헹구면 면이 늘어져 실패한다. 얼음물이면 더 좋다.' },
      { title: '양념은 면보다 먼저', body: '김치가 양념을 머금을 시간을 준다. 2분만 재워도 맛이 달라진다.' },
      { title: '신 김치일수록 맛있다', body: '안 신 김치라면 식초를 1/2큰술 더 넣어 산미를 보충한다.' },
    ];

    const VARIATIONS = [
      { emoji: '🐟', title: '참치 비빔국수', body: '참치캔 하나를 기름 빼고 넣으면 든든한 한 끼가 된다.' },
      { emoji: '🍚', title: '김치 비빔밥',   body: '면 대신 밥을 비비면 그대로 김치 비빔밥.' },
      { emoji: '🌱', title: '콩나물 추가',   body: '삶은 콩나물 한 줌을 넣으면 아삭한 식감이 더해진다.' },
    ];

    // ========================================
    // 🔧 Utilities
    // ========================================

    const FRACTION_LABELS = { 0.25: '1/4', 0.33: '1/3', 0.5: '1/2', 0.67: '2/3', 0.75: '3/4' };

    function formatQty(value) {
      const rounded = Math.round(value * 100) / 100;
      if (Number.isInteger(rounded)) return String(rounded);
      const whole = Math.floor(rounded);
      const frac = Math.round((rounded - whole) * 100) / 100;
      const label = FRACTION_LABELS[frac];
      if (label) return whole > 0 ? `${whole}과 ${label}` : label;
      return String(rounded);
    }

    function formatClock(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ========================================
    // 🧩 Layout Components
    // ========================================

    function Hero({ servings }) {
      return (
        <header className="relative overflow-hidden bg-stone-900 text-white">
          <div
            className="absolute inset-0 opacity-30"
            style={{ background: 'radial-gradient(120% 90% at 15% 0%, #b91c1c 0%, transparent 55%), radial-gradient(90% 80% at 90% 20%, #a16207 0%, transparent 60%)' }}
            aria-hidden="true"
          />
          <div className="relative mx-auto max-w-4xl px-5 py-14 sm:py-20">
            <div className="flex flex-wrap items-center gap-2">
              <Badge tone="red">15분 완성</Badge>
              <Badge tone="green">난이도 매우 쉬움</Badge>
              <Badge tone="amber">불 앞 5분</Badge>
            </div>
            <h1 className="mt-5 text-4xl font-black leading-tight tracking-tight sm:text-6xl">
              들기름 김치말이<br className="sm:hidden" /> 비빔국수
            </h1>
            <p className="mt-4 max-w-xl text-base leading-relaxed text-stone-300 sm:text-lg">
              익은 김치 하나로 승부하는 새콤 고소한 비빔국수.
              불 앞에 서는 시간은 5분뿐입니다.
            </p>
            <dl className="mt-8 grid max-w-lg grid-cols-3 gap-3 text-center">
              {[
                ['조리 시간', '15분'],
                ['분량', `${servings}인분`],
                ['핵심 재료', '익은 김치'],
              ].map(([term, value]) => (
                <div key={term} className="rounded-xl bg-white/10 px-3 py-3 ring-1 ring-white/15 backdrop-blur-sm">
                  <dt className="text-[11px] font-medium uppercase tracking-wider text-stone-300">{term}</dt>
                  <dd className="mt-1 text-lg font-bold">{value}</dd>
                </div>
              ))}
            </dl>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="border-t border-stone-200 bg-stone-50 py-10 text-center">
          <p className="text-sm text-stone-500">15분 레시피북 · 들기름 김치말이 비빔국수</p>
          <p className="mt-1 text-xs text-stone-400">재료 배율과 체크 상태는 새로고침하면 초기화됩니다.</p>
        </footer>
      );
    }

    // ========================================
    // 📄 Page Sections
    // ========================================

    function ServingControl({ servings, onChange }) {
      const options = [1, 2, 4, 6];
      return (
        <div className="no-print flex flex-wrap items-center gap-3">
          <span className="text-sm font-semibold text-stone-600">인분</span>
          <div className="flex rounded-xl bg-stone-100 p-1" role="group" aria-label="분량 선택">
            {options.map(n => (
              <button
                key={n}
                type="button"
                onClick={() => onChange(n)}
                aria-pressed={servings === n}
                className={`rounded-lg px-3.5 py-1.5 text-sm font-bold transition ${
                  servings === n ? 'bg-white text-red-600 shadow-sm' : 'text-stone-500 hover:text-stone-800'
                }`}
              >
                {n}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function IngredientSection({ servings, onServingsChange }) {
      const [checked, setChecked] = useState({});
      const ratio = servings / BASE_SERVINGS;

      const groups = useMemo(() => {
        const map = new Map();
        INGREDIENTS.forEach((item, index) => {
          if (!map.has(item.group)) map.set(item.group, []);
          map.get(item.group).push({ ...item, index });
        });
        return Array.from(map.entries());
      }, []);

      const doneCount = Object.values(checked).filter(Boolean).length;

      const toggle = (index) => setChecked(prev => ({ ...prev, [index]: !prev[index] }));

      return (
        <section>
          <Card className="p-6 sm:p-8">
            <div className="flex flex-wrap items-start justify-between gap-4">
              <SectionTitle eyebrow="Ingredients" title="재료">
                {servings}인분 기준 · 체크하며 준비하세요
              </SectionTitle>
              <ServingControl servings={servings} onChange={onServingsChange} />
            </div>

            <div className="no-print mb-4 flex items-center justify-between border-b border-stone-200 pb-4">
              <Badge tone={doneCount === INGREDIENTS.length ? 'green' : 'neutral'}>
                준비 완료 {doneCount} / {INGREDIENTS.length}
              </Badge>
              <Button variant="ghost" size="sm" onClick={() => setChecked({})} disabled={doneCount === 0}>
                체크 초기화
              </Button>
            </div>

            <div className="grid gap-8 sm:grid-cols-2">
              {groups.map(([group, items]) => (
                <div key={group}>
                  <h3 className="mb-2 border-b border-stone-200 pb-2 text-sm font-bold tracking-wide text-stone-500">
                    {group}
                  </h3>
                  <ul className="divide-y divide-stone-100">
                    {items.map(item => (
                      <li key={item.index} className="flex items-center gap-3">
                        <div className="min-w-0 flex-1">
                          <Checkbox
                            checked={!!checked[item.index]}
                            onChange={() => toggle(item.index)}
                            label={item.name}
                            sub={item.note || null}
                          />
                        </div>
                        <span className={`shrink-0 text-sm font-bold tabular-nums transition ${
                          checked[item.index] ? 'text-stone-300' : 'text-stone-700'
                        }`}>
                          {item.qty === null ? item.unit : `${formatQty(item.qty * ratio)}${item.unit}`}
                        </span>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </Card>
        </section>
      );
    }

    function Timer({ activeStep, elapsed, running, finished, onToggle, onReset }) {
      const progress = Math.min(100, (elapsed / (15 * 60)) * 100);
      return (
        <Card className="sticky top-4 z-10 p-5 sm:p-6">
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <p className="text-xs font-bold uppercase tracking-widest text-stone-400">경과 시간</p>
              <p className={`mt-1 text-4xl font-black tabular-nums ${running ? 'text-red-600' : 'text-stone-800'}`}>
                {formatClock(elapsed)}
              </p>
            </div>
            <div className="no-print flex gap-2">
              <Button
                variant={running ? 'secondary' : 'primary'}
                onClick={onToggle}
                className={running ? '' : 'pulse-ring'}
              >
                {running ? '❚❚ 일시정지' : (elapsed > 0 ? '▶ 계속' : '▶ 시작')}
              </Button>
              <Button variant="ghost" onClick={onReset} disabled={elapsed === 0 && !running}>리셋</Button>
            </div>
          </div>

          <div className="mt-4 h-2 w-full overflow-hidden rounded-full bg-stone-100">
            <div
              className="h-full rounded-full bg-red-600 transition-all duration-500"
              style={{ width: `${progress}%` }}
              role="progressbar"
              aria-valuenow={Math.round(progress)}
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label="조리 진행률"
            />
          </div>

          <p className="mt-3 text-sm text-stone-600" aria-live="polite">
            {finished
              ? <span className="font-bold text-emerald-600">15분 완주! 이제 담아내기만 하면 됩니다 🎉</span>
              : <>지금 할 일 · <span className="font-bold text-stone-900">{activeStep.title}</span></>}
          </p>
        </Card>
      );
    }

    function StepList({ activeIndex, done, onToggleDone }) {
      return (
        <ol className="mt-6 space-y-3">
          {STEPS.map((step, i) => {
            const isActive = i === activeIndex;
            const isDone = !!done[i];
            return (
              <li key={step.title}>
                <Card className={`fade-up p-5 transition ${isActive ? 'shadow-md ring-2 ring-red-500' : ''} ${isDone ? 'opacity-60' : ''}`}>
                  <div className="flex gap-4">
                    <div className="flex w-12 shrink-0 flex-col items-center">
                      <span className={`flex h-9 w-9 items-center justify-center rounded-full text-sm font-black ${
                        isDone ? 'bg-emerald-500 text-white'
                          : isActive ? 'bg-red-600 text-white'
                          : 'bg-stone-100 text-stone-500'
                      }`}>
                        {isDone ? '✓' : i + 1}
                      </span>
                      <span className="mt-1.5 text-[11px] font-bold tabular-nums text-stone-400">{step.at}분</span>
                    </div>

                    <div className="min-w-0 flex-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <h3 className={`text-base font-bold ${isDone ? 'text-stone-400 line-through' : 'text-stone-900'}`}>
                          {step.title}
                        </h3>
                        {isActive && !isDone && <Badge tone="red">진행 중</Badge>}
                      </div>
                      <p className="mt-1.5 text-sm leading-relaxed text-stone-600">{step.body}</p>
                      {step.tip && (
                        <p className="mt-2.5 rounded-lg bg-amber-50 px-3 py-2 text-xs font-medium leading-relaxed text-amber-900 ring-1 ring-amber-100">
                          💡 {step.tip}
                        </p>
                      )}
                    </div>

                    <div className="no-print shrink-0 self-start">
                      <Button
                        variant={isDone ? 'ghost' : 'secondary'}
                        size="sm"
                        onClick={() => onToggleDone(i)}
                        aria-label={`${i + 1}단계 ${isDone ? '완료 취소' : '완료 표시'}`}
                      >
                        {isDone ? '되돌리기' : '완료'}
                      </Button>
                    </div>
                  </div>
                </Card>
              </li>
            );
          })}
        </ol>
      );
    }

    function CookingSection() {
      const [elapsed, setElapsed] = useState(0);
      const [running, setRunning] = useState(false);
      const [done, setDone] = useState({});

      useEffect(() => {
        if (!running) return undefined;
        const id = setInterval(() => {
          setElapsed(prev => (prev >= 20 * 60 ? prev : prev + 1));
        }, 1000);
        return () => clearInterval(id);
      }, [running]);

      const activeIndex = useMemo(() => {
        const minutes = elapsed / 60;
        let index = 0;
        STEPS.forEach((step, i) => { if (minutes >= step.at) index = i; });
        return index;
      }, [elapsed]);

      const toggleDone = useCallback((i) => {
        setDone(prev => ({ ...prev, [i]: !prev[i] }));
      }, []);

      const reset = useCallback(() => {
        setRunning(false);
        setElapsed(0);
        setDone({});
      }, []);

      return (
        <section>
          <SectionTitle eyebrow="Cooking" title="만드는 법">
            타이머를 켜면 지금 해야 할 단계가 자동으로 표시됩니다.
          </SectionTitle>
          <Timer
            activeStep={STEPS[activeIndex]}
            elapsed={elapsed}
            running={running}
            finished={elapsed >= 15 * 60}
            onToggle={() => setRunning(r => !r)}
            onReset={reset}
          />
          <StepList activeIndex={activeIndex} done={done} onToggleDone={toggleDone} />
        </section>
      );
    }

    function KeyPointSection() {
      return (
        <section>
          <SectionTitle eyebrow="Key Points" title="성공 포인트">
            이것만 지키면 실패하지 않습니다.
          </SectionTitle>
          <div className="grid gap-4 sm:grid-cols-3">
            {KEY_POINTS.map(point => (
              <Card key={point.title} className="border-t-4 border-red-600 p-5">
                <h3 className="text-sm font-bold text-stone-900">{point.title}</h3>
                <p className="mt-2 text-sm leading-relaxed text-stone-600">{point.body}</p>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    function VariationSection() {
      return (
        <section>
          <SectionTitle eyebrow="Variations" title="응용">
            같은 양념으로 다르게 즐기는 방법.
          </SectionTitle>
          <div className="grid gap-4 sm:grid-cols-3">
            {VARIATIONS.map(item => (
              <Card key={item.title} className="p-5">
                <span className="text-2xl" aria-hidden="true">{item.emoji}</span>
                <h3 className="mt-2 text-sm font-bold text-stone-900">{item.title}</h3>
                <p className="mt-1.5 text-sm leading-relaxed text-stone-600">{item.body}</p>
              </Card>
            ))}
          </div>
        </section>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [servings, setServings] = useState(BASE_SERVINGS);

      return (
        <div className="min-h-screen bg-stone-50 text-stone-800">
          <Hero servings={servings} />
          <main className="mx-auto max-w-4xl space-y-14 px-5 py-12 sm:py-16">
            <IngredientSection servings={servings} onServingsChange={setServings} />
            <CookingSection />
            <KeyPointSection />
            <VariationSection />
          </main>
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
