<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>납부지연가산세(납부불성실 가산세) 계산기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeUp .28s ease-out both; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 📌 도메인 상수 — 국세기본법 시행령 제27조의4
    // ========================================

    // 일할 이자율 연혁 (법 제47조의4①1호·2호)
    // 각 구간은 시작일(포함)부터 다음 구간 시작 전날까지 적용
    const DAILY_RATE_SEGMENTS = [
      { from: '1900-01-01', rate: 0.0003,  label: '1일 10만분의 30' }, // ~2019.2.11
      { from: '2019-02-12', rate: 0.00025, label: '1일 10만분의 25' }, // 2019.2.12~2022.2.14
      { from: '2022-02-15', rate: 0.00022, label: '1일 10만분의 22' }, // 2022.2.15~
    ];

    const MONTHLY_RATE = 0.0067;         // 월 1만분의 67 (영 제27조의4②)
    const NOTICE_SURCHARGE = 0.03;       // 100분의 3 (법 제47조의4①3호)
    const MAX_MONTHS = 60;               // 5년 한도 (법 제47조의4⑦)
    const MIN_TAX_FOR_MONTHLY = 1500000; // 150만원 미만 배제 (법 제47조의4⑧)

    // ========================================
    // 🧮 날짜 · 계산 유틸
    // ========================================

    const MS_PER_DAY = 86400000;

    function toDate(str) {
      if (!str) return null;
      const d = new Date(str + 'T00:00:00');
      return isNaN(d.getTime()) ? null : d;
    }

    function addDays(date, n) {
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + n);
      return d;
    }

    function diffDays(a, b) {
      return Math.round((b.getTime() - a.getTime()) / MS_PER_DAY);
    }

    function fmtDate(date) {
      if (!date) return '-';
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return y + '.' + m + '.' + d;
    }

    const won = (n) => Math.floor(n).toLocaleString('ko-KR') + '원';

    // 양끝 포함 기간을 이자율 구간별로 분할해 일수를 센다
    function splitByRate(start, end) {
      if (!start || !end || diffDays(start, end) < 0) return [];
      const out = [];
      for (let i = 0; i < DAILY_RATE_SEGMENTS.length; i++) {
        const seg = DAILY_RATE_SEGMENTS[i];
        const segStart = toDate(seg.from);
        const segEnd = i + 1 < DAILY_RATE_SEGMENTS.length
          ? addDays(toDate(DAILY_RATE_SEGMENTS[i + 1].from), -1)
          : null;

        const s = diffDays(segStart, start) >= 0 ? start : segStart;
        const e = (segEnd && diffDays(segEnd, end) > 0) ? segEnd : end;
        const days = diffDays(s, e) + 1;
        if (days > 0) out.push({ from: s, to: e, days, rate: seg.rate, label: seg.label });
      }
      return out;
    }

    // 지정납부기한 다음날 ~ 납부일 전날의 "경과한 개월 수" (1개월 미만 절사)
    function elapsedMonths(fromExclusive, toExclusive) {
      const start = addDays(fromExclusive, 1);
      const end = addDays(toExclusive, -1);
      if (diffDays(start, end) < 0) return 0;

      let months = 0;
      while (months < 1200) {
        const next = new Date(start.getTime());
        next.setMonth(next.getMonth() + (months + 1));
        if (diffDays(addDays(next, -1), end) >= 0) months += 1;
        else break;
      }
      return months;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ children, className = '' }) {
      return (
        <div className={'bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/70 ' + className}>
          {children}
        </div>
      );
    }

    function Field({ label, hint, error, children }) {
      return (
        <div className="space-y-1.5">
          <label className="block text-sm font-semibold text-slate-700">{label}</label>
          {children}
          {hint && !error && <p className="text-xs text-slate-400 break-keep">{hint}</p>}
          {error && <p className="text-xs font-medium text-rose-600 break-keep">{error}</p>}
        </div>
      );
    }

    function TextInput({ error, className = '', ...props }) {
      const base = 'w-full rounded-xl border px-3.5 py-2.5 text-sm text-slate-900 outline-none transition focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 disabled:bg-slate-50 disabled:text-slate-400 ';
      const tone = error ? 'border-rose-300 bg-rose-50/40 ' : 'border-slate-300 bg-white ';
      return <input {...props} className={base + tone + className} />;
    }

    function Toggle({ checked, onChange, label, description }) {
      return (
        <button
          type="button"
          role="switch"
          aria-checked={checked}
          onClick={() => onChange(!checked)}
          className={'w-full flex items-start gap-3 rounded-xl border p-3.5 text-left transition ' +
            (checked ? 'border-indigo-300 bg-indigo-50/60' : 'border-slate-200 bg-white hover:bg-slate-50')}
        >
          <span className={'mt-0.5 inline-flex h-5 w-9 shrink-0 items-center rounded-full transition ' +
            (checked ? 'bg-indigo-600' : 'bg-slate-300')}>
            <span className={'h-4 w-4 rounded-full bg-white shadow transition-transform ' +
              (checked ? 'translate-x-4' : 'translate-x-0.5')} />
          </span>
          <span>
            <span className="block text-sm font-semibold text-slate-800">{label}</span>
            {description && <span className="block text-xs text-slate-500 mt-0.5 break-keep">{description}</span>}
          </span>
        </button>
      );
    }

    function Badge({ children, tone = 'slate' }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-600',
        indigo: 'bg-indigo-100 text-indigo-700',
        amber: 'bg-amber-100 text-amber-700',
        rose: 'bg-rose-100 text-rose-700',
        light: 'bg-white/15 text-white',
      };
      return (
        <span className={'inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ' + tones[tone]}>
          {children}
        </span>
      );
    }

    // ========================================
    // 🧩 결과 표시 컴포넌트
    // ========================================

    function ResultRow({ title, badge, amount, formula, children }) {
      return (
        <div className="px-5 py-4 border-t border-slate-100">
          <div className="flex items-start justify-between gap-4">
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-sm font-semibold text-slate-800">{title}</span>
                {badge}
              </div>
              {formula && <p className="mt-1 text-xs text-slate-500 break-keep">{formula}</p>}
              {children}
            </div>
            <span className="shrink-0 text-sm font-bold tabular-nums text-slate-900">{won(amount)}</span>
          </div>
        </div>
      );
    }

    function EmptyResult({ message }) {
      return (
        <Card className="p-10 text-center">
          <div className="text-4xl mb-3">🧾</div>
          <p className="text-sm text-slate-500 break-keep">{message}</p>
        </Card>
      );
    }

    // ========================================
    // 📄 Page — 납부지연가산세 계산기
    // ========================================

    function CalculatorPage() {
      const todayISO = new Date().toISOString().slice(0, 10);

      const [taxAmount, setTaxAmount] = useState('');
      const [legalDue, setLegalDue] = useState('');
      const [payDate, setPayDate] = useState(todayISO);
      const [hasNotice, setHasNotice] = useState(false);
      const [noticeDate, setNoticeDate] = useState('');
      const [designatedDue, setDesignatedDue] = useState('');

      const amount = Number(String(taxAmount).replace(/[^0-9]/g, '')) || 0;

      const errors = useMemo(() => {
        const e = {};
        const d0 = toDate(legalDue), d1 = toDate(payDate);
        const dn = toDate(noticeDate), dd = toDate(designatedDue);

        if (taxAmount !== '' && amount <= 0) e.taxAmount = '0보다 큰 금액을 입력하세요.';
        if (d0 && d1 && diffDays(d0, d1) < 0) e.payDate = '납부일은 법정납부기한 이후여야 합니다.';
        if (hasNotice) {
          if (dn && d0 && diffDays(d0, dn) < 0) e.noticeDate = '납부고지일은 법정납부기한 이후여야 합니다.';
          if (dd && dn && diffDays(dn, dd) < 0) e.designatedDue = '지정납부기한은 납부고지일 이후여야 합니다.';
          if (dd && d1 && diffDays(dd, d1) < 0) e.payDate = '납부일은 지정납부기한 이후여야 합니다.';
        }
        return e;
      }, [taxAmount, amount, legalDue, payDate, hasNotice, noticeDate, designatedDue]);

      const ready = amount > 0 && !!legalDue && !!payDate
        && (!hasNotice || (!!noticeDate && !!designatedDue))
        && Object.keys(errors).length === 0;

      const result = useMemo(() => {
        if (!ready) return null;

        const d0 = toDate(legalDue);
        const d1 = toDate(payDate);
        const dn = hasNotice ? toDate(noticeDate) : null;
        const dd = hasNotice ? toDate(designatedDue) : null;

        // ① 법 제47조의4①1호 — 법정납부기한 다음날 ~ (납부고지일 또는 납부일)의 전날
        const dailyStart = addDays(d0, 1);
        const dailyEnd = addDays(hasNotice ? dn : d1, -1);
        const segments = splitByRate(dailyStart, dailyEnd);
        const dailyDays = segments.reduce((s, x) => s + x.days, 0);
        const dailyTax = segments.reduce((s, x) => s + amount * x.days * x.rate, 0);

        // ② 법 제47조의4①3호 — 지정납부기한까지 미납 시 3%
        const surcharge = hasNotice ? amount * NOTICE_SURCHARGE : 0;

        // ③ 법 제47조의4①1호의2 — 지정납부기한 다음날 ~ 납부일 전날, 경과 개월수 × 0.67%
        let rawMonths = 0, months = 0, monthlyTax = 0, monthlyExcluded = null;
        if (hasNotice) {
          rawMonths = elapsedMonths(dd, d1);
          months = Math.min(rawMonths, MAX_MONTHS);
          if (amount < MIN_TAX_FOR_MONTHLY) {
            monthlyExcluded = '고지서별·세목별 세액이 150만원 미만이므로 적용 제외 (법 제47조의4⑧)';
          } else {
            monthlyTax = amount * months * MONTHLY_RATE;
          }
        }

        const total = Math.floor(dailyTax) + Math.floor(surcharge) + Math.floor(monthlyTax);

        return {
          d0, d1, dn, dd,
          segments, dailyDays, dailyStart, dailyEnd,
          dailyTax: Math.floor(dailyTax),
          surcharge: Math.floor(surcharge),
          rawMonths, months, monthlyExcluded,
          monthlyTax: Math.floor(monthlyTax),
          total,
          capped: rawMonths > MAX_MONTHS,
          grandTotal: amount + total,
          effRate: amount > 0 ? (total / amount) * 100 : 0,
        };
      }, [ready, amount, legalDue, payDate, hasNotice, noticeDate, designatedDue]);

      const handleAmount = useCallback((e) => {
        const raw = e.target.value.replace(/[^0-9]/g, '');
        setTaxAmount(raw ? Number(raw).toLocaleString('ko-KR') : '');
      }, []);

      const reset = () => {
        setTaxAmount(''); setLegalDue(''); setPayDate(todayISO);
        setHasNotice(false); setNoticeDate(''); setDesignatedDue('');
      };

      const timeline = [
        { label: '법정납부기한', date: result && result.d0, tone: 'bg-slate-400' },
        hasNotice ? { label: '납부고지일', date: result && result.dn, tone: 'bg-indigo-500' } : null,
        hasNotice ? { label: '지정납부기한', date: result && result.dd, tone: 'bg-amber-500' } : null,
        { label: '납부일', date: result && result.d1, tone: 'bg-emerald-500' },
      ].filter(Boolean);

      return (
        <div className="min-h-screen">
          {/* ===== Header ===== */}
          <header className="bg-gradient-to-br from-indigo-600 via-indigo-600 to-violet-600 text-white">
            <div className="max-w-5xl mx-auto px-5 py-10 sm:py-14">
              <Badge tone="light">국세기본법 제47조의4</Badge>
              <h1 className="mt-3 text-2xl sm:text-3xl font-bold tracking-tight">납부지연가산세 계산기</h1>
              <p className="mt-2 text-sm sm:text-base text-indigo-100 break-keep max-w-2xl">
                옛 명칭 &lsquo;납부불성실 가산세&rsquo;. 세금을 기한까지 내지 못했을 때 붙는 가산세를
                일할·3%·월할 항목으로 나누어 계산합니다.
              </p>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-5 py-8 grid gap-6 lg:grid-cols-5 items-start">
            {/* ===== 입력 ===== */}
            <section className="lg:col-span-2 space-y-4">
              <Card className="p-5 space-y-5">
                <h2 className="text-base font-bold text-slate-900">입력</h2>

                <Field label="미납·과소납부 세액" hint="가산세를 뺀 본세 기준" error={errors.taxAmount}>
                  <div className="relative">
                    <TextInput
                      inputMode="numeric"
                      value={taxAmount}
                      onChange={handleAmount}
                      placeholder="예: 5,000,000"
                      error={errors.taxAmount}
                      className="pr-10 text-right font-semibold tabular-nums"
                      aria-label="미납 세액"
                    />
                    <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-sm text-slate-400">원</span>
                  </div>
                </Field>

                <Field label="법정납부기한" hint="신고·납부 기한 (예: 종합소득세 5/31)">
                  <TextInput type="date" value={legalDue} onChange={e => setLegalDue(e.target.value)} aria-label="법정납부기한" />
                </Field>

                <Field label="실제 납부일" hint="아직 납부 전이라면 납부 예정일" error={errors.payDate}>
                  <TextInput type="date" value={payDate} onChange={e => setPayDate(e.target.value)} error={errors.payDate} aria-label="실제 납부일" />
                </Field>

                <div className="pt-1">
                  <Toggle
                    checked={hasNotice}
                    onChange={setHasNotice}
                    label="세무서로부터 납부고지서를 받았음"
                    description="고지분에는 3% 가산세와 월 0.67% 가산세가 추가됩니다."
                  />
                </div>

                {hasNotice && (
                  <div className="space-y-4 animate-fade-up rounded-xl bg-slate-50 p-4">
                    <Field label="납부고지일" error={errors.noticeDate}>
                      <TextInput type="date" value={noticeDate} onChange={e => setNoticeDate(e.target.value)} error={errors.noticeDate} aria-label="납부고지일" />
                    </Field>
                    <Field label="지정납부기한" hint="고지서에 적힌 납부기한" error={errors.designatedDue}>
                      <TextInput type="date" value={designatedDue} onChange={e => setDesignatedDue(e.target.value)} error={errors.designatedDue} aria-label="지정납부기한" />
                    </Field>
                  </div>
                )}

                <button
                  type="button"
                  onClick={reset}
                  className="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50 transition"
                >
                  초기화
                </button>
              </Card>
            </section>

            {/* ===== 결과 ===== */}
            <section className="lg:col-span-3 space-y-4">
              {!result && <EmptyResult message="세액과 기한을 입력하면 가산세가 자동으로 계산됩니다." />}

              {result && (
                <div className="space-y-4 animate-fade-up">
                  <Card className="overflow-hidden">
                    <div className="bg-slate-900 px-5 py-5 text-white">
                      <div className="flex items-center gap-2">
                        <p className="text-xs font-medium text-slate-300">가산세 합계</p>
                        <Badge tone="light">본세 대비 {result.effRate.toFixed(2)}%</Badge>
                      </div>
                      <p className="mt-1 text-3xl font-bold tabular-nums">{won(result.total)}</p>
                      <div className="mt-4 flex items-center justify-between border-t border-white/10 pt-3 text-sm">
                        <span className="text-slate-300">본세 + 가산세 총 납부액</span>
                        <span className="font-bold tabular-nums">{won(result.grandTotal)}</span>
                      </div>
                    </div>

                    <ResultRow
                      title="① 납부지연가산세 (일할)"
                      badge={<Badge tone="indigo">{result.dailyDays.toLocaleString('ko-KR')}일</Badge>}
                      amount={result.dailyTax}
                      formula={fmtDate(result.dailyStart) + ' ~ ' + fmtDate(result.dailyEnd) + ' · 법 제47조의4①1호'}
                    >
                      {result.segments.length > 0 && (
                        <ul className="mt-2 space-y-1">
                          {result.segments.map((s, i) => (
                            <li key={i} className="text-xs text-slate-500 tabular-nums break-keep">
                              · {fmtDate(s.from)}~{fmtDate(s.to)} · {s.days.toLocaleString('ko-KR')}일 × {(s.rate * 100).toFixed(3)}%
                              <span className="ml-1 text-slate-400">= {won(amount * s.days * s.rate)}</span>
                            </li>
                          ))}
                        </ul>
                      )}
                      {result.dailyDays === 0 && (
                        <p className="mt-1 text-xs text-slate-400">경과일수 0일 — 해당 없음</p>
                      )}
                    </ResultRow>

                    {hasNotice && (
                      <ResultRow
                        title="② 지정납부기한 경과 가산세"
                        badge={<Badge tone="amber">일시 3%</Badge>}
                        amount={result.surcharge}
                        formula={'미납세액 × 3% · 법 제47조의4①3호'}
                      />
                    )}

                    {hasNotice && (
                      <ResultRow
                        title="③ 고지 후 납부지연가산세 (월할)"
                        badge={
                          <Badge tone={result.monthlyExcluded ? 'slate' : 'rose'}>
                            {result.monthlyExcluded ? '적용 제외' : result.months + '개월'}
                          </Badge>
                        }
                        amount={result.monthlyTax}
                        formula={fmtDate(addDays(result.dd, 1)) + ' ~ ' + fmtDate(addDays(result.d1, -1)) + ' · 월 0.67% · 법 제47조의4①1호의2'}
                      >
                        {result.monthlyExcluded && (
                          <p className="mt-1 text-xs text-slate-500 break-keep">{result.monthlyExcluded}</p>
                        )}
                        {result.capped && !result.monthlyExcluded && (
                          <p className="mt-1 text-xs text-rose-600 break-keep">
                            실제 경과 {result.rawMonths}개월이나 5년(60개월) 한도 적용 · 법 제47조의4⑦
                          </p>
                        )}
                      </ResultRow>
                    )}
                  </Card>

                  <Card className="p-5">
                    <h3 className="text-sm font-bold text-slate-900 mb-3">기간 흐름</h3>
                    <ol className="space-y-3">
                      {timeline.map((step, i) => (
                        <li key={i} className="flex items-center gap-3">
                          <span className={'h-2.5 w-2.5 rounded-full shrink-0 ' + step.tone} />
                          <span className="text-sm text-slate-600 w-28 shrink-0">{step.label}</span>
                          <span className="text-sm font-semibold text-slate-900 tabular-nums">{fmtDate(step.date)}</span>
                        </li>
                      ))}
                    </ol>
                  </Card>
                </div>
              )}

              {/* ===== 계산 근거 ===== */}
              <Card className="p-5">
                <h3 className="text-sm font-bold text-slate-900 mb-3">계산 근거</h3>
                <dl className="space-y-2.5 text-xs text-slate-600 break-keep">
                  <div className="flex gap-3">
                    <dt className="shrink-0 font-semibold text-slate-800 w-20">일할 이자율</dt>
                    <dd>1일 10만분의 22 (0.022%) — 시행령 제27조의4①. 과거 기간은
                      2019.2.11까지 0.030%, 2019.2.12~2022.2.14 0.025%로 자동 분할 계산합니다.</dd>
                  </div>
                  <div className="flex gap-3">
                    <dt className="shrink-0 font-semibold text-slate-800 w-20">월할 이자율</dt>
                    <dd>월 1만분의 67 (0.67%) — 시행령 제27조의4②. 1개월 미만 기간은 절사합니다.</dd>

                  </div>
                  <div className="flex gap-3">
                    <dt className="shrink-0 font-semibold text-slate-800 w-20">한도·예외</dt>
                    <dd>월할분 기간은 최대 5년. 고지서별·세목별 세액이 150만원 미만이면 월할분을 적용하지 않습니다.</dd>

                <p className="mt-4 rounded-lg bg-amber-50 px-3 py-2.5 text-xs text-amber-800 break-keep">

                  기한연장·독촉비용, 인지세 특례 등은 반영되지 않아 실제 고지세액과 다를 수 있습니다.
                </p>
              </Card>

      );
